<div id="programas" class="programas-container">
  <h2>Nossos Programas</h2>
  <p>
    Na DrawLab, acreditamos que qualquer pessoa pode desenvolver seu talento artístico com as
    ferramentas certas. Por isso, criamos programas completos para cada nível de aprendizado
  </p>
  <div class="programas-lista">
    <app-programas-card
      [titulo]="'Iniciante Criativo'"
      [texto]="'Aprenda os fundamentos do desenho digital, conheça os principais softwares e dê seus primeiros passos no universo criativo'"
      [identif]="'programa-card-iniciante'">
    </app-programas-card>
    <app-programas-card
      [titulo]="'Intermediário em Ação'"
      [texto]="'Aprofunde suas técnicas, explore estilos diferentes e desenvolva projetos que elevam sua identidade artística.'"
      [identif]="'programa-card-Intermediario'">
    </app-programas-card>
    <app-programas-card
      [titulo]="'Avançado Profissional'"
      [texto]="'Domine as ferramentas, crie portfólios profissionais e prepare-se para transformar sua arte em carreira.'"
      [identif]="'programa-card-Avancado'">
    </app-programas-card>
    <app-programas-card
      [titulo]="'Workshops e Masterclasses'"
      [texto]="'Aulas especiais com artistas convidados, trazendo novas tendências, técnicas e inspirações para você evoluir constantemente.'"
      [identif]="'programa-card-Workshops'">
    </app-programas-card>
  </div>
</div>
